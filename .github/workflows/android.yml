name: Android verification
on:
  pull_request:
  push:
    branches: [main, master, 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease --console=plain
      - run: ./gradlew :app:lintDebug --console=plain
      - shell: pwsh
        run: ./scripts/verify-schemas.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-reports
          path: |
            app/build/reports
            app/build/outputs/apk
            app/build/outputs/mapping
  device:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build-type: [debug, validation]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Enable KVM for the disposable emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew -PinstrumentationBuildType=${{ matrix.build-type }} :app:connected${{ matrix.build-type == 'debug' && 'Debug' || 'Validation' }}AndroidTest --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-${{ matrix.build-type }}-reports
          path: app/build/reports/androidTests
